apiVersion: apps/v1
kind: Deployment
metadata:
  name: support-ticket-api
  namespace: support
  labels:
    app: support-ticket-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: support-ticket-api
  template:
    metadata:
      labels:
        app: support-ticket-api
    spec:
      containers:
        - name: api
          image: ghcr.io/your-org/support-ticket-platform:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: support-ticket-config
            - secretRef:
                name: support-ticket-secrets
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
