apiVersion: v1
kind: ConfigMap
metadata:
  name: support-ticket-grafana-dashboard
  namespace: support
  labels:
    grafana_dashboard: "1"
data:
  support-ticket-api.json: |
    {
      "title": "Support Ticket API",
      "schemaVersion": 39,
      "panels": [
        {
          "type": "timeseries",
          "title": "HTTP request rate",
          "targets": [
            {
              "expr": "sum(rate(http_server_requests_seconds_count{application=\"support-ticket-platform\"}[5m]))",
              "legendFormat": "requests/s"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 0, "y": 0}
        },
        {
          "type": "timeseries",
          "title": "JVM memory used",
          "targets": [
            {
              "expr": "jvm_memory_used_bytes{application=\"support-ticket-platform\"}",
              "legendFormat": "{{area}}"
            }
          ],
          "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}
        }
      ]
    }
